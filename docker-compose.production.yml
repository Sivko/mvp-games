
services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_LOGIN}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASS}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - app_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app_network
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nest-backend:
    image: nest-backend:latest
    container_name: nest-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NEST_URL=https://top-otvet.limpopo113.ru/bff/api
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_LOGIN=${MONGODB_LOGIN}
      - MONGODB_PASS=${MONGODB_PASS}
      - NODE_ENV=production
    volumes:
      - ./.env.production:/app/.env.production:ro
    networks:
      - app_network
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nest-backend.rule=Host(`top-otvet.limpopo113.ru`) && PathPrefix(`/bff/api`)"
      - "traefik.http.routers.nest-backend.priority=100"
      - "traefik.http.routers.nest-backend.entrypoints=websecure"
      - "traefik.http.routers.nest-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nest-backend.tls.domains[0].main=top-otvet.limpopo113.ru"
      - "traefik.http.routers.nest-backend.middlewares=strip-prefix"
      - "traefik.http.middlewares.strip-prefix.stripprefix.prefixes=/bff/api"
      - "traefik.http.services.nest-backend.loadbalancer.server.port=3000"
      # WebSocket support - Traefik автоматически определяет WebSocket по заголовку Upgrade

  frontend:
    image: frontend:latest
    container_name: frontend
    restart: unless-stopped
    networks:
      - app_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`top-otvet.limpopo113.ru`) && !PathPrefix(`/admin`) && !PathPrefix(`/bff/api`)"
      - "traefik.http.routers.frontend.priority=10"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.tls.domains[0].main=top-otvet.limpopo113.ru"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  admin:
    image: admin:latest
    container_name: admin
    restart: unless-stopped
    networks:
      - app_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`top-otvet.limpopo113.ru`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.admin.priority=50"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin.tls.domains[0].main=top-otvet.limpopo113.ru"
      - "traefik.http.routers.admin.middlewares=admin-strip-prefix"
      - "traefik.http.middlewares.admin-strip-prefix.stripprefix.prefixes=/admin"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

volumes:
  mongodb_data:
  mongodb_config:
  elasticsearch_data:

