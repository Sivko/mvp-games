
services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_LOGIN}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASS}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh ${MONGODB_HOST}:${MONGODB_PORT}/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  elasticsearch-prod:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch-prod
    restart: unless-stopped
    # Порты закрыты для production
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nest-backend:
    image: nest-backend:latest
    container_name: nest-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NEST_URL=https://mvp-games.limpopo113.ru/bff/api
    volumes:
      - ./.env.production:/app/.env.production:ro
    networks:
      - app-network
    depends_on:
      - mongodb
      - elasticsearch-prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nest-backend.rule=Host(`mvp-games.limpopo113.ru`) && PathPrefix(`/bff/api`)"
      - "traefik.http.routers.nest-backend.entrypoints=websecure"
      - "traefik.http.routers.nest-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.nest-backend.loadbalancer.server.port=3000"
      - "traefik.http.routers.nest-backend.middlewares=nest-backend-stripprefix"
      - "traefik.http.middlewares.nest-backend-stripprefix.stripprefix.prefixes=/bff/api"

volumes:
  mongodb_data:
  mongodb_config:
  elasticsearch_data:

networks:
  app-network:
    driver: bridge

