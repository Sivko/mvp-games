<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .disconnect {
            background-color: #f44336;
        }
        .disconnect:hover {
            background-color: #da190b;
        }
        input {
            padding: 10px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 20px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #4CAF50;
            background-color: white;
        }
        .error {
            border-left-color: #f44336;
        }
        .status {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .connected {
            background-color: #d4edda;
            color: #155724;
        }
        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Test Client</h1>
        
        <div id="status" class="status disconnected">Disconnected</div>
        
        <div>
            <button id="connectBtn" onclick="connect()">Connect</button>
            <button id="disconnectBtn" onclick="disconnect()" disabled class="disconnect">Disconnect</button>
            <button onclick="sendPing()">Send Ping</button>
        </div>
        
        <div style="margin-top: 20px;">
            <input type="text" id="messageInput" placeholder="Enter message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send Message</button>
        </div>
        
        <div id="messages"></div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let socket = null;

        function addMessage(message, isError = false) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message' + (isError ? ' error' : '');
            messageDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            if (connected) {
                statusDiv.className = 'status connected';
                statusDiv.textContent = 'Connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = 'Disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function connect() {
            socket = io('https://top-otvet.limpopo113.ru', {
                path: '/bff/api/socket.io',
                transports: ['websocket']
            });

            socket.on('connect', () => {
                addMessage('Connected to server');
                updateStatus(true);
            });

            socket.on('disconnect', () => {
                addMessage('Disconnected from server');
                updateStatus(false);
            });

            socket.on('message', (data) => {
                addMessage(`Message: ${JSON.stringify(data)}`);
            });

            socket.on('broadcast', (data) => {
                addMessage(`Broadcast: ${JSON.stringify(data)}`);
            });

            socket.on('pong', (data) => {
                addMessage(`Pong: ${JSON.stringify(data)}`);
            });

            socket.on('connect_error', (error) => {
                addMessage(`Connection error: ${error.message}`, true);
                updateStatus(false);
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                addMessage('Disconnected manually');
                updateStatus(false);
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (socket && socket.connected && message) {
                socket.emit('message', { message: message });
                addMessage(`Sent: ${message}`);
                input.value = '';
            } else if (!socket || !socket.connected) {
                addMessage('Not connected to server', true);
            } else {
                addMessage('Please enter a message', true);
            }
        }

        function sendPing() {
            if (socket && socket.connected) {
                socket.emit('ping');
                addMessage('Sent: ping');
            } else {
                addMessage('Not connected to server', true);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
