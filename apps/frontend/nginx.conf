server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Настройки кодировки для правильной обработки UTF-8 (важно для файлов с эмодзи)
    charset utf-8;
    source_charset utf-8;

    # Отключаем autoindex для безопасности
    autoindex off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Статические файлы из public (включая /mems/) - должен быть перед regex location
    location /mems/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Кэширование статических ресурсов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing - все запросы возвращают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Безопасность заголовков
    # Разрешаем встраивание в iframe с любого домена
    add_header Content-Security-Policy "frame-ancestors *" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

